<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register — RIDEX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/register.css">

</head>

<body>

<div class="register-container">

    <!-- Left brand panel -->
    <div class="brand-panel" data-role="USER">

        <div class="stripe stripe-1"></div>
        <div class="stripe stripe-2"></div>

        <div class="brand-top">
            <span class="brand-mark">RIDE<span class="mark-x">X</span></span>
        </div>

        <div class="brand-copy">
            <p class="brand-eyebrow" id="brandEyebrow">join the fleet</p>
            <h1 class="brand-headline" id="brandHeadline">Your next ride<br>starts with<br>an account.</h1>
        </div>

        <div class="role-scene" aria-hidden="true">
            <svg viewBox="0 0 240 200" class="scene-svg" id="sceneSvg">
                <ellipse cx="120" cy="176" rx="92" ry="10" class="scene-shadow" />

                <g id="sceneIconUser">
                    <path d="M28 128 L46 96 Q60 78 96 78 L156 78 Q186 78 202 100 L222 128 Z" class="scene-fill" />
                    <rect x="16" y="120" width="212" height="26" rx="8" class="scene-fill" />
                    <circle cx="66" cy="150" r="18" class="scene-wheel" />
                    <circle cx="180" cy="150" r="18" class="scene-wheel" />
                    <rect x="92" y="88" width="70" height="30" rx="6" class="scene-glass" />
                </g>

                <g id="sceneIconProvider" style="display:none">
                    <circle cx="66" cy="150" r="26" class="scene-wheel-lg" />
                    <circle cx="180" cy="150" r="26" class="scene-wheel-lg" />
                    <path d="M66 150 L104 96 H140 M104 96 L124 150 M124 150 L180 150 M104 96 L86 150" class="scene-stroke" />
                    <path d="M124 150 L152 108" class="scene-stroke" />
                </g>
            </svg>
        </div>

        <p class="brand-foot">Two rides, one road.</p>

    </div>

    <!-- Right form panel -->
    <div class="form-panel">

        <div class="register-box">

            <h2>Create account</h2>
            <p class="subtitle">Join RIDEX and get moving.</p>

            <div class="role-toggle" role="radiogroup" aria-label="Register as">
                <button type="button" class="role-btn is-active" data-role="USER" role="radio" aria-checked="true">
                    I want to ride
                </button>
                <button type="button" class="role-btn" data-role="PROVIDER" role="radio" aria-checked="false">
                    I list vehicles
                </button>
            </div>

            <form id="registerForm" novalidate>

                <label class="field-label" for="name">Full name</label>
                <input type="text" id="name" placeholder="Your name" autocomplete="name" required>

                <label class="field-label" for="email">Email</label>
                <input type="email" id="email" placeholder="name@company.com" autocomplete="email" required>

                <label class="field-label" for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" required>
                    <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <input type="hidden" id="role" value="USER">

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitLabel">Create account as a rider</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

</div>

<script src="../js/register.js"></script>
</body>
</html>
